<style>*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --creme:#FCF7EF; --papier:#FFFDFA; --tinte:#231F1A; --leise:#6B6259;
  --linie:#EBE1D2; --linie-stark:#DDD0BC;
  --nacht:#2E3A5C; --messing:#9A7235;
  --nacht-bg:#E9EDF4; --messing-bg:#F7EFE1;
  --teal:#3D6B62; --pflaume:#6A4A62; --rost:#A05A3A; --rose:#8A575B;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  /* Kompatibilität: alte Namen zeigen auf die neuen Werte */
  --bg:#FCF7EF; --card:#F7EFE1; --ink:#231F1A; --soft:#6B6259;
  --ind:#2E3A5C; --gold:#9A7235; --line:#EBE1D2;
  --fire:#A05A3A; --earth:#3D6B62; --air:#2E3A5C; --water:#6A4A62;
  --flow:#3D6B62; --tense:#A05A3A;
}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:34px 20px 80px;}
.back{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ind);text-decoration:none;margin-bottom:22px;}
.back:hover{text-decoration:underline;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(32px,6.5vw,52px);line-height:1.03;letter-spacing:-.02em;margin-bottom:14px;color:var(--ind);}
h1 em{font-style:italic;}
.lede{font-size:16px;color:var(--soft);max-width:640px;line-height:1.7;margin-bottom:8px;}
h2{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:38px 0 8px;color:var(--ind);}
h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:24px 0 6px;}
.sub{font-size:14px;color:var(--soft);margin-bottom:16px;}
p{margin-bottom:12px;}
.tip{background:#FBEFE6;border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin:24px 0;font-size:14px;line-height:1.6;color:var(--soft);}
.tip b{color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
.foot{margin-top:44px;padding-top:22px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--soft);line-height:1.6;}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px;}
.pill.fire{background:#FBE3DA;color:var(--fire);}
.pill.earth{background:#E8EDDC;color:var(--earth);}
.pill.air{background:#DEEBF1;color:var(--air);}
.pill.water{background:#E6E1F0;color:var(--water);}
a{color:var(--ind);}

.weiter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:38px 0 0;}
@media(max-width:560px){.weiter{grid-template-columns:1fr;}}
.weiter a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:14px 16px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;}
.weiter a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(193,68,14,.10);}
.weiter .lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
.weiter .ttl{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;color:var(--ind);line-height:1.25;}
.weiter .nx{text-align:right;}
.weiter .end{grid-column:1/-1;text-align:center;}

/* — vereinheitlichte Typografie — */
body{font-family:var(--sans)!important;}
h1,h2,h3,h4,.titel,.nm,.pos{font-family:var(--serif)!important;font-weight:400!important;}
h1{font-weight:300!important;letter-spacing:-.01em;}
h1 em{font-style:italic;font-weight:400;color:var(--nacht);}
.eyebrow,.augenbraue{font-family:var(--sans)!important;font-size:11.5px;letter-spacing:.16em;
 text-transform:uppercase;color:var(--messing);font-weight:500;}
.back,.zurueck{font-family:var(--sans)!important;font-size:14px;color:var(--leise);text-decoration:none;}
.back:hover,.zurueck:hover{color:var(--nacht);}
a{color:var(--nacht);}
.tip{background:var(--messing-bg)!important;border-left:3px solid var(--messing)!important;}
.foot{color:var(--leise);}
.weiter a{background:var(--papier);border-color:var(--linie);}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

.ac-leiste{border-bottom:1px solid var(--linie);background:var(--papier);margin-bottom:0;}
.ac-leiste-inner{max-width:820px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:10px;}
.ac-marke{font-family:var(--sans);font-size:15px;color:var(--tinte);text-decoration:none;letter-spacing:.01em;}
.ac-tool{margin-left:auto;font-family:var(--sans);font-size:14px;color:var(--nacht);text-decoration:none;
 border:1px solid var(--linie);border-radius:18px;padding:6px 14px;}
.ac-tool:hover{background:var(--nacht-bg);}

.ac-nav{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;}
.ac-nav a{font-family:var(--sans);font-size:14px;color:var(--leise);text-decoration:none;
 padding:6px 12px;border-radius:16px;}
.ac-nav a:hover{background:var(--nacht-bg);color:var(--nacht);}
.ac-nav a.ist{background:var(--nacht);color:#fff;}
@media(max-width:560px){.ac-nav a{padding:5px 9px;font-size:13px;}}

.ac-begriff{color:var(--nacht);text-decoration:none;border-bottom:1px dotted var(--messing);}
.ac-begriff:hover{border-bottom-style:solid;background:var(--messing-bg);}
.ac-begriff::after{content:'↗';font-size:.72em;vertical-align:2px;margin-left:2px;color:var(--messing);}

.an-wrap{max-width:600px;margin:0 auto;padding:40px 24px 70px;}
.an-marke{display:flex;align-items:center;gap:9px;margin-bottom:34px;}
.an-marke a{font-family:var(--serif);font-size:17px;color:var(--tinte);text-decoration:none;}
.an-balken{display:flex;gap:6px;margin-bottom:30px;}
.an-balken i{flex:1;height:5px;border-radius:4px;background:var(--linie);transition:background .25s;}
.an-balken i.voll{background:var(--nacht);}
.an-balken i.jetzt{background:var(--messing);}
.an-schritt{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--messing);margin-bottom:9px;}
.an-titel{font-family:var(--serif);font-size:clamp(26px,5.4vw,36px);font-weight:300;line-height:1.14;
 color:var(--tinte);margin:0 0 10px;letter-spacing:-.015em;}
.an-titel em{font-style:italic;color:var(--nacht);}
.an-text{font-size:15.5px;line-height:1.65;color:var(--leise);margin:0 0 24px;}
.an-feld{margin-bottom:15px;}
.an-feld label{display:block;font-family:var(--sans);font-size:13px;color:var(--tinte);margin-bottom:6px;}
.an-feld label span{color:var(--leise);font-size:12.5px;}
.an-feld input{width:100%;padding:14px 16px;border:1px solid var(--linie);border-radius:14px;
 background:var(--papier);font-family:var(--sans);font-size:16px;color:var(--tinte);}
.an-feld input:focus{outline:none;border-color:var(--nacht);}
.an-zwei{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.an-orte{border:1px solid var(--linie);border-radius:13px;background:var(--papier);margin-top:5px;overflow:hidden;}
.an-orte button{display:block;width:100%;text-align:left;padding:11px 15px;border:none;background:none;
 font-family:var(--sans);font-size:14.5px;color:var(--tinte);cursor:pointer;border-bottom:1px solid var(--linie);}
.an-orte button:last-child{border-bottom:none;}
.an-orte button:hover{background:var(--nacht-bg);}
.an-orte button span{color:var(--leise);font-size:12.5px;margin-left:6px;}
.an-ok{font-size:13px;color:#3F6B4A;margin-top:6px;}
.an-wahl{display:grid;gap:10px;margin-bottom:8px;}
.an-wahl button{display:flex;gap:15px;align-items:center;text-align:left;padding:17px 19px;
 border:1px solid var(--linie);background:var(--papier);border-radius:17px;cursor:pointer;
 font-family:var(--sans);color:var(--tinte);}
.an-wahl button:hover{border-color:var(--nacht);}
.an-wahl button[aria-pressed="true"]{border-color:var(--nacht);background:var(--nacht-bg);box-shadow:0 0 0 1px var(--nacht) inset;}
.an-wahl .ic{width:48px;height:48px;border-radius:14px;background:var(--bg);flex:none;
 display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--nacht);}
.an-wahl button[aria-pressed="true"] .ic{background:var(--nacht);color:#fff;}
.an-wahl b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;margin-bottom:2px;}
.an-wahl small{font-size:13.5px;color:var(--leise);line-height:1.45;}
.an-vorschlag{background:var(--messing-bg);border-radius:14px;padding:13px 16px;margin-bottom:16px;
 font-size:14px;line-height:1.55;}
.an-themen{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
@media(max-width:520px){.an-themen{grid-template-columns:1fr;}}
.an-themen button{text-align:left;padding:14px 16px;border:1px solid var(--linie);background:var(--papier);
 border-radius:15px;cursor:pointer;font-family:var(--sans);color:var(--tinte);}
.an-themen button:hover{border-color:var(--nacht);}
.an-themen button[aria-pressed="true"]{border-color:var(--nacht);background:var(--nacht-bg);box-shadow:0 0 0 1px var(--nacht) inset;}
.an-themen b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:400;margin-bottom:3px;}
.an-themen small{font-size:13px;color:var(--leise);font-style:italic;}
.an-leiste{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:28px;flex-wrap:wrap;}
.an-weiter{font-family:var(--sans);font-size:16px;border:1px solid var(--nacht);background:var(--nacht);color:#fff;
 padding:14px 30px;border-radius:26px;cursor:pointer;}
.an-weiter:hover{background:#3B4970;}
.an-weiter[disabled]{opacity:.4;cursor:default;}
.an-leer{font-family:var(--sans);font-size:14.5px;background:none;border:none;color:var(--leise);
 cursor:pointer;text-decoration:underline;padding:8px 0;}
.an-zurueck{font-family:var(--sans);font-size:14.5px;background:none;border:none;color:var(--nacht);cursor:pointer;padding:8px 0;}
.an-privat{font-size:13px;color:var(--leise);line-height:1.55;margin-top:18px;padding-top:14px;border-top:1px solid var(--linie);}
.an-fertig{text-align:center;}
.an-fertig .kreis{width:74px;height:74px;border-radius:50%;background:var(--nacht);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 22px;}
.an-zus{background:var(--papier);border:1px solid var(--linie);border-radius:18px;padding:18px 20px;
 text-align:left;margin:22px 0;}
.an-zus div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--linie);font-size:14.5px;}
.an-zus div:last-child{border-bottom:none;}
.an-zus span{color:var(--leise);}

 ['wunder-punkt','Der wunde Punkt','Was tut immer wieder weh?'],
 ['herkunft','Herkunft','Was läuft aus der Familie mit?'],
 ['anders-verdrahtet','Anders verdrahtet','Warum ist Alltag so anstrengend?'],
 ['zugehoerigkeit','Zugehörigkeit','Warum fühle ich mich außen?'],
 ['alltag','Alltag','Wie kriege ich Struktur hin?'],
 ['koerper','Körper','Was braucht mein Körper?']];

function speichern(){
  try{ localStorage.setItem(ICH_KEY, JSON.stringify({format:ich.format, erklaerung:ich.erklaerung,
    themen:ich.themen, fertig:true, stand:Date.now()})); }catch(e){}
  if(ich.format){ try{ localStorage.setItem('ac_format', ich.format); }catch(e){} }
}

function balken(){
  var b=document.getElementById('anbalken'); b.innerHTML='';
  for(var i=0;i<4;i++){ var x=document.createElement('i');
    if(i<schritt) x.className='voll'; else if(i===schritt) x.className='jetzt'; b.appendChild(x); }
  b.style.display=(schritt>=4)?'none':'flex';
}

function zeige(){
  balken();
  var f=[s1,s2,s3,s4,fertig][schritt];
  f(document.getElementById('anbuehne'));
  window.scrollTo(0,0);
}
function weiterLeiste(ok, ueberspringbar){
  return '<div class="an-leiste">'+
    (schritt>0?'<button class="an-zurueck" id="anzur" type="button">← Zurück</button>':'<span></span>')+
    '<span style="display:flex;gap:16px;align-items:center;">'+
    (ueberspringbar?'<button class="an-leer" id="anskip" type="button">Später</button>':'')+
    '<button class="an-weiter" id="anweiter" type="button"'+(ok?'':' disabled')+'>Weiter</button></span></div>';
}
function knoepfe(ok){
  var w=document.getElementById('anweiter'), z=document.getElementById('anzur'), s=document.getElementById('anskip');
  if(w) w.addEventListener('click',function(){ if(ok()){ speichern(); schritt++; zeige(); } });
  if(z) z.addEventListener('click',function(){ schritt--; zeige(); });
  if(s) s.addEventListener('click',function(){ speichern(); schritt++; zeige(); });
}

/* ── 1 · Wer du bist ── */
function s1(el){
  el.innerHTML='<div class="an-schritt">Schritt 1 von 4</div>'+
    '<h1 class="an-titel">Wer <em>bist</em> du?</h1>'+
    '<p class="an-text">Das Einzige, was wirklich nötig ist — ohne Geburtsdaten kann nichts gerechnet werden. '+
    'Die genaue Uhrzeit macht den Unterschied zwischen einer groben und einer persönlichen Deutung.</p>'+
    '<div class="an-feld"><label>Wie soll ich dich nennen? <span>— ein Vorname reicht</span></label>'+
      '<input id="anname" type="text" autocomplete="given-name" value="'+person.name.replace(/"/g,'')+'"></div>'+
    '<div class="an-zwei">'+
      '<div class="an-feld"><label>Geburtsdatum</label><input id="andatum" type="date" value="'+person.datum+'"></div>'+
      '<div class="an-feld"><label>Uhrzeit <span>— so genau wie möglich</span></label><input id="anzeit" type="time" value="'+person.zeit+'"></div>'+
    '</div>'+
    '<div class="an-feld"><label>Geburtsort</label>'+
      '<input id="anort" type="text" placeholder="Ort eingeben…" value="'+(person.ort?person.ort.name:'')+'" autocomplete="off">'+
      '<div id="anorte"></div><div id="anortok"></div></div>'+
    weiterLeiste(false,false)+
    '<div class="an-privat">Alles bleibt in deinem Browser. Nichts wird an einen Server geschickt, '+
    'und du kannst es unter Profile jederzeit löschen.</div>';

  var inp=document.getElementById('anort'), liste=document.getElementById('anorte'), okb=document.getElementById('anortok');
  function pruef(){
    var ok=!!(document.getElementById('andatum').value && document.getElementById('anzeit').value && person.ort);
    document.getElementById('anweiter').disabled=!ok;
    return ok;
  }
  if(person.ort) okb.innerHTML='<div class="an-ok">✓ '+person.ort.name+(person.ort.land?', '+person.ort.land:'')+'</div>';
  inp.addEventListener('input',function(){
    person.ort=null; okb.innerHTML='';
    var r=(window.AC_ortSuche?AC_ortSuche(inp.value,6):[]);
    if(!r.length){ liste.innerHTML=''; pruef(); return; }
    liste.innerHTML='<div class="an-orte">'+r.map(function(o,i){
      return '<button type="button" data-i="'+i+'">'+o.name+'<span>'+(o.alt?o.alt+' · ':'')+o.land+'</span></button>';
    }).join('')+'</div>';
    Array.prototype.forEach.call(liste.querySelectorAll('button'),function(b){
      b.addEventListener('click',function(){
        person.ort=r[+b.getAttribute('data-i')];
        inp.value=person.ort.name; liste.innerHTML='';
        okb.innerHTML='<div class="an-ok">✓ '+person.ort.name+', '+person.ort.land+'</div>';
        pruef();
      });
    });
    pruef();
  });
  ['andatum','anzeit'].forEach(function(i){ document.getElementById(i).addEventListener('input',pruef); });
  pruef();

  knoepfe(function(){
    if(!pruef()) return false;
    var dt=document.getElementById('andatum').value.split('-'), zt=document.getElementById('anzeit').value.split(':');
    person.name=document.getElementById('anname').value.trim()||'Ich';
    var y=+dt[0],mo=+dt[1],d=+dt[2],h=+zt[0],mi=+zt[1];
    var tz=(person.ort.tz&&window.AC_offset)?AC_offset(person.ort.tz,y,mo,d,h,mi):(person.ort.alt||1);
    try{
      var e=AC_P.eigenes();
      var neu={name:person.name,y:y,mo:mo,d:d,h:h,mi:mi,tz:tz,lat:person.ort.lat,lon:person.ort.lon,
        ort:person.ort.name+(person.ort.land?', '+person.ort.land:''),tzName:person.ort.tz,eigen:true};
      if(e&&AC_P.aendere) AC_P.aendere(e.id,neu); else AC_P.hinzu(neu);
    }catch(err){ console.error(err); }
    return true;
  });
}

/* ── 2 · Wie du liest ── */
function merkur(){
  try{
    var e=AC_P.eigenes(); if(!e) return null;
    var ut=e.h+e.mi/60-e.tz, T=(jdFromUT(e.y,e.mo,e.d,ut)-2451545)/36525;
    var zi=Math.floor(geo('Merkur',T)/30), el=zi%4;
    var v=(el===1)?'lang':(el===3)?'visuell':'kurz';
    var g=['Feuer will schnell zum Punkt','Erde nimmt Ausführliches gut auf','Luft mag den Überblick','Wasser denkt in Bildern'][el];
    return {v:v, z:SIGNS[zi], g:g};
  }catch(e){ return null; }
}
function s2(el){
  var m=merkur();
  if(!ich.format&&m) ich.format=m.v;
  var O=[['kurz','▭','Kurz','Das Wichtigste in wenigen Sätzen. Mehr, wenn ich klicke.'],
         ['lang','≡','Ausführlich','Gern der ganze Zusammenhang, auch mit Hintergrund.'],
         ['visuell','◉','Visuell','Grafiken, Räder, Balken — Text nur, wo nötig.']];
  el.innerHTML='<div class="an-schritt">Schritt 2 von 4</div>'+
    '<h1 class="an-titel">Wie <em>liest</em> du am liebsten?</h1>'+
    '<p class="an-text">Die Inhalte sind dieselben — nur ihre Form ändert sich. Du kannst das später jederzeit umstellen.</p>'+
    (m?'<div class="an-vorschlag">Vorausgewählt ist <b>'+{kurz:'Kurz',lang:'Ausführlich',visuell:'Visuell'}[m.v]+
      '</b>, weil dein Merkur in '+m.z+' steht — '+m.g+'. Das ist nur ein Vorschlag. <b>Du weißt es besser als die Rechnung.</b></div>':'')+
    '<div class="an-wahl" id="anwahl"></div>'+weiterLeiste(!!ich.format,true);
  var w=document.getElementById('anwahl');
  O.forEach(function(o){
    var b=document.createElement('button'); b.type='button';
    b.innerHTML='<div class="ic">'+o[1]+'</div><div><b>'+o[2]+'</b><small>'+o[3]+'</small></div>';
    b.setAttribute('aria-pressed', ich.format===o[0]);
    b.addEventListener('click',function(){
      ich.format=o[0];
      Array.prototype.forEach.call(w.children,function(c){c.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');
      document.getElementById('anweiter').disabled=false;
    });
    w.appendChild(b);
  });
  knoepfe(function(){ return !!ich.format; });
}

/* ── 3 · Wie viel Erklärung ── */
function s3(el){
  var O=[['ja','?','Bitte erklären','Ich kenne mich noch wenig aus. Fachbegriffe gern verlinkt.'],
         ['teils','·','Nur wo nötig','Die Grundlagen kenne ich, bei Speziellem freue ich mich über Hilfe.'],
         ['nein','✓','Nicht nötig','Ich kenne mich aus. Links zu Erklärungen stören mich eher.']];
  el.innerHTML='<div class="an-schritt">Schritt 3 von 4</div>'+
    '<h1 class="an-titel">Wie viel <em>Erklärung</em> brauchst du?</h1>'+
    '<p class="an-text">Davon hängt ab, ob Begriffe wie Trigon, Aszendent oder Lilith im Text verlinkt sind '+
    'oder einfach dastehen.</p>'+
    '<div class="an-wahl" id="anwahl"></div>'+weiterLeiste(!!ich.erklaerung,true);
  var w=document.getElementById('anwahl');
  O.forEach(function(o){
    var b=document.createElement('button'); b.type='button';
    b.innerHTML='<div class="ic">'+o[1]+'</div><div><b>'+o[2]+'</b><small>'+o[3]+'</small></div>';
    b.setAttribute('aria-pressed', ich.erklaerung===o[0]);
    b.addEventListener('click',function(){
      ich.erklaerung=o[0];
      Array.prototype.forEach.call(w.children,function(c){c.setAttribute('aria-pressed','false');});
      b.setAttribute('aria-pressed','true');
      document.getElementById('anweiter').disabled=false;
    });
    w.appendChild(b);
  });
  knoepfe(function(){ return !!ich.erklaerung; });
}

/* ── 4 · Warum du hier bist ── */
function s4(el){
  el.innerHTML='<div class="an-schritt">Schritt 4 von 4</div>'+
    '<h1 class="an-titel">Was <em>beschäftigt</em> dich gerade?</h1>'+
    '<p class="an-text">Such dir aus, was passt — eins, mehrere oder keins. Die Startseite zeigt dir dann genau diese Themen zuerst.</p>'+
    '<div class="an-themen" id="anthemen"></div>'+weiterLeiste(true,true);
  var w=document.getElementById('anthemen');
  RAEUME.forEach(function(r){
    var b=document.createElement('button'); b.type='button';
    b.innerHTML='<b>'+r[1]+'</b><small>„'+r[2]+'"</small>';
    b.setAttribute('aria-pressed', ich.themen.indexOf(r[0])>=0);
    b.addEventListener('click',function(){
      var i=ich.themen.indexOf(r[0]);
      if(i<0) ich.themen.push(r[0]); else ich.themen.splice(i,1);
      b.setAttribute('aria-pressed', i<0);
    });
    w.appendChild(b);
  });
  var wb=document.getElementById('anweiter'); if(wb) wb.textContent='Fertig';
  knoepfe(function(){ return true; });
}

/* ── Fertig ── */
function fertig(el){
  speichern();
  var e=null; try{ e=AC_P.eigenes(); }catch(err){}
  var NAM={kurz:'Kurz',lang:'Ausführlich',visuell:'Visuell'};
  var ER={ja:'Bitte erklären',teils:'Nur wo nötig',nein:'Nicht nötig'};
  var th=ich.themen.map(function(t){ var r=RAEUME.filter(function(x){return x[0]===t;})[0]; return r?r[1]:t; });
  el.innerHTML='<div class="an-fertig"><div class="kreis">✓</div>'+
    '<h1 class="an-titel">Angekommen'+(e&&e.name?', <em>'+e.name+'</em>':'')+'.</h1>'+
    '<p class="an-text">Ab jetzt richtet sich die Seite nach dir.</p>'+
    '<div class="an-zus">'+
      '<div>Geburt<span>'+(e?e.d+'.'+e.mo+'.'+e.y+' · '+('0'+e.h).slice(-2)+':'+('0'+e.mi).slice(-2)+' · '+(e.ort||'').split(',')[0]:'—')+'</span></div>'+
      '<div>Darstellung<span>'+(NAM[ich.format]||'noch offen')+'</span></div>'+
      '<div>Erklärungen<span>'+(ER[ich.erklaerung]||'noch offen')+'</span></div>'+
      '<div>Themen<span>'+(th.length?th.join(', '):'keine gewählt')+'</span></div>'+
    '</div>'+
    '<button class="an-weiter" id="anlos" type="button">Zur Startseite</button>'+
    '<p class="an-privat" style="text-align:center;border:none;">Alles davon kannst du jederzeit ändern — '+
    'unten auf der Startseite steht der Link dazu.</p></div>';
  document.getElementById('anlos').addEventListener('click',function(){ location.href='index.html'; });
}

zeige();

</script>
