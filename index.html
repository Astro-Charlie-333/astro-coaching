<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heute · Astro-Charlie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<script src="profil.js"></script>
<script src="fortschritt.js"></script>
<script src="staedte.js"></script>
<script src="ankommen.js"></script>
<script src="wetter.js"></script>
<script src="format.js" defer></script>
<style>
:root{
  --creme:#FCF7EF; --papier:#FFFDFA; --tinte:#231F1A; --leise:#6B6259;
  --linie:#EBE1D2; --linie-stark:#DDD0BC;
  --nacht:#2E3A5C; --messing:#9A7235;
  --nacht-bg:#E9EDF4; --messing-bg:#F7EFE1;
  --teal:#3D6B62; --pflaume:#6A4A62; --rost:#A05A3A; --rose:#8A575B;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --sp:clamp(64px,9vw,104px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--creme);color:var(--tinte);
  font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--nacht);outline-offset:3px;border-radius:4px}
.bahn{max-width:900px;margin:0 auto;padding:0 24px}

/* Kopfleiste */
.leiste{border-bottom:1px solid var(--linie);background:var(--papier);position:sticky;top:0;z-index:20}
.leiste-inner{max-width:900px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:11px}
.logo{width:22px;height:22px;flex:0 0 auto}
.marke{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.01em}
.sprung{margin-left:auto;display:flex;gap:20px;font-size:14px;color:var(--leise)}
.sprung a{text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent}
.sprung a:hover{color:var(--nacht);border-bottom-color:var(--messing)}
@media(max-width:640px){.sprung{display:none}}

/* Held */
.held{position:relative;overflow:hidden}
.held-inner{max-width:900px;margin:0 auto;padding:clamp(60px,10vw,104px) 24px clamp(48px,7vw,72px);position:relative;z-index:2}
.ring{position:absolute;top:50%;right:-200px;transform:translateY(-50%);
  width:540px;height:540px;opacity:.4;z-index:1;pointer-events:none}
@media(prefers-reduced-motion:no-preference){.ring{animation:dreh 420s linear infinite}}
@keyframes dreh{to{transform:translateY(-50%) rotate(360deg)}}
.augenbraue{font-size:13.5px;color:var(--messing);letter-spacing:.14em;margin:0 0 22px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(40px,7.2vw,68px);
  line-height:1.06;letter-spacing:-.022em;margin:0 0 24px;max-width:15ch}
h1 em{font-style:normal;color:var(--nacht)}
.intro{font-size:18.5px;line-height:1.72;color:var(--leise);margin:0;max-width:46ch}
.intro b{color:var(--tinte);font-weight:500}

/* Abschnittsmarke */
.marke-zeile{display:flex;align-items:center;gap:14px;margin:var(--sp) 0 8px}
.marke-zeile h2{font-family:var(--serif);font-weight:400;font-size:clamp(27px,4vw,36px);
  letter-spacing:-.015em;margin:0;line-height:1.15}
.marke-zeile .strich{flex:1;height:1px;background:var(--linie-stark)}
.marke-sub{font-size:16px;color:var(--leise);margin:0 0 28px;max-width:52ch}

/* Heute */
.heute-karte{background:var(--papier);border:1px solid var(--linie);border-radius:18px;
  padding:26px 28px;box-shadow:0 1px 0 var(--linie)}
.heute-kopf{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.heute-kopf h2{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--nacht);margin:0;line-height:1.1}
.heute-datum{font-size:13px;color:var(--leise)}
.heute-sub{font-size:15.5px;color:var(--leise);margin:0 0 20px;line-height:1.6;max-width:56ch}
.heute-form{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end}
@media(max-width:860px){.heute-form{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.heute-form{grid-template-columns:1fr}}
.heute-form label{display:block;font-size:12.5px;color:var(--messing);margin-bottom:6px;font-weight:500}
.heute-form input,.heute-form select{width:100%;padding:10px 12px;border:1px solid var(--linie-stark);
  border-radius:10px;background:var(--creme);font-family:var(--sans);font-size:15px;color:var(--tinte)}
.heute-knopf{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hbtn{font-family:var(--sans);font-size:15px;font-weight:500;border:1px solid var(--nacht);
  background:var(--nacht);color:#fff;padding:11px 24px;border-radius:24px;cursor:pointer}
.hbtn:hover{background:#3A4A70}
.hbtn.leer{background:none;color:var(--nacht)}
.hbtn.leer:hover{background:var(--nacht-bg)}
.heute-hint{font-size:13.5px;color:var(--leise)}
.mondzeile{display:flex;align-items:center;gap:16px;padding:16px 0 18px;
  border-bottom:1px solid var(--linie);margin-bottom:18px}
.mondzeile svg{width:44px;height:44px;flex:none}
.mondzeile b{font-size:16.5px;font-weight:500;display:block}
.mondzeile span{font-size:14px;color:var(--leise)}
.tlist{display:grid;gap:11px}
.tzeile{display:grid;grid-template-columns:auto 1fr;gap:15px;align-items:start;
  background:var(--creme);border:1px solid var(--linie);border-left:3px solid var(--linie-stark);
  border-radius:12px;padding:14px 16px}
.tzeile .tgly{font-size:19px;color:var(--nacht);line-height:1.25;white-space:nowrap}
.tzeile .tkopf{font-size:14.5px;margin-bottom:3px}
.tzeile .tkopf b{font-weight:500}
.tzeile .torb{font-size:12px;color:var(--leise)}
.tzeile .ttext{font-size:15px;line-height:1.6;margin-top:6px}
.tzeile.eng{border-color:#E3D2B2;border-left-color:var(--messing);background:var(--messing-bg)}
.tzeile.eng .torb{color:var(--messing)}
.tnichts{font-size:15px;color:var(--leise);line-height:1.6;background:var(--creme);
  border:1px solid var(--linie);border-radius:12px;padding:16px 18px}
.heute-fuss{margin-top:16px;font-size:13.5px;color:var(--leise);line-height:1.6}
.heute-fuss a{color:var(--nacht)}

/* Wege */
.wege{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.weg{display:flex;flex-direction:column;text-decoration:none;background:var(--papier);
  border:1px solid var(--linie);border-left:3px solid var(--akz,var(--linie-stark));
  border-radius:14px;padding:24px 26px 22px;transition:border-color .15s,transform .15s}
.weg:hover{border-color:var(--akz);transform:translateY(-1px)}
.weg-glyph{font-size:19px;color:var(--akz);line-height:1;margin-bottom:14px}
.weg-frage{font-size:18.5px;font-weight:500;line-height:1.4;margin:0 0 9px}
.weg-text{font-size:15px;color:var(--leise);margin:0;line-height:1.6}
.weg.betont{background:var(--nacht);border-color:var(--nacht);border-left-color:var(--messing);color:#FFFDFA}
.weg.betont .weg-text{color:#C6CEDF}
.weg.betont .weg-glyph{color:#D8B77E}
.weg.betont:hover{background:#3A4A70}
.weg-marke{align-self:flex-start;background:rgba(216,183,126,.2);color:#EBD9B6;
  font-size:12.5px;padding:4px 12px;border-radius:20px;margin-bottom:14px;font-weight:500}

/* Regal */
.regal{display:flex;flex-direction:column;gap:11px}
details{background:var(--papier);border:1px solid var(--linie);
  border-left:3px solid var(--akz,var(--linie-stark));border-radius:14px}
summary{cursor:pointer;list-style:none;padding:20px 24px;display:flex;align-items:flex-start;gap:15px}
summary::-webkit-details-marker{display:none}
summary:hover .sum-titel{color:var(--akz)}
.sum-glyph{font-size:17px;color:var(--akz);line-height:1.55;flex:0 0 20px}
.sum-body{flex:1;min-width:0}
.sum-titel{display:block;font-size:17.5px;font-weight:500;line-height:1.4}
.sum-text{display:block;font-size:14.5px;color:var(--leise);margin-top:5px;line-height:1.5}
.sum-zahl{flex:0 0 auto;font-size:13px;color:var(--leise);padding-left:10px;line-height:1.9}
.sum-zeichen{flex:0 0 auto;color:var(--leise);font-size:20px;line-height:1.5;padding-left:6px;transition:transform .15s}
details[open] .sum-zeichen{transform:rotate(90deg);color:var(--akz)}
.inhalt{padding:0 24px 10px}
.inhalt a{display:block;text-decoration:none;padding:15px 0;border-top:1px solid var(--linie)}
.inhalt a:hover .zeile-titel{color:var(--akz)}
.zeile-titel{display:block;font-size:16px;font-weight:500;line-height:1.45}
.zeile-text{display:block;font-size:14.5px;color:var(--leise);margin-top:5px;line-height:1.55}
.neu{display:inline-block;background:var(--messing-bg);color:var(--messing);font-size:11.5px;
  font-weight:600;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:2px}

.notiz{background:var(--nacht-bg);border-radius:16px;padding:26px 30px;margin:var(--sp) 0 0}
.notiz p{margin:0;font-size:16px;color:#46536F;line-height:1.7;max-width:58ch}
.notiz strong{color:var(--nacht);font-weight:600}
footer{max-width:900px;margin:64px auto 0;padding:28px 24px 80px;
  border-top:1px solid var(--linie);font-size:14.5px;color:var(--leise);line-height:1.75}
@media(max-width:640px){
  .held-inner{padding:52px 24px 48px}
  .ring{right:-270px;width:430px;height:430px;opacity:.28}
  .weg{padding:20px 22px}
  summary{padding:18px 20px}
  .inhalt{padding:0 20px 8px}
  .heute-karte{padding:22px 20px}
  .sum-zahl{display:none}
}

.ortfeld{position:relative;}
.ortfeld input{width:100%;}
.ortliste{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:var(--papier,#fff);
 border:1px solid var(--linie,#EBE1D2);border-radius:12px;box-shadow:0 8px 24px rgba(40,30,20,.13);
 max-height:270px;overflow-y:auto;display:none;}
.ortliste.auf{display:block;}
.ortliste button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--linie,#EBE1D2);
 padding:10px 13px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--tinte,#231F1A);line-height:1.35;}
.ortliste button:last-child{border-bottom:0;}
.ortliste button:hover,.ortliste button.aktiv{background:var(--nacht-bg,#E9EDF4);}
.ortok{font-size:12.5px;color:var(--leise,#6B6259);margin-top:5px;line-height:1.45;}
.ortok b{color:var(--tinte,#231F1A);}

.ac-nav{margin-left:auto;display:flex;gap:3px;flex-wrap:wrap;}
.ac-nav a{font-family:var(--sans);font-size:14px;color:var(--leise);text-decoration:none;padding:6px 12px;border-radius:16px;}
.ac-nav a:hover{background:var(--nacht-bg);color:var(--nacht);}
.ac-nav a.ist{background:var(--nacht);color:#fff;}
@media(max-width:560px){.ac-nav a{padding:5px 9px;font-size:13px;}}

.ac-begriff{color:var(--nacht);text-decoration:none;border-bottom:1px dotted var(--messing);}
.ac-begriff:hover{border-bottom-style:solid;background:var(--messing-bg);}
.ac-begriff::after{content:'↗';font-size:.72em;vertical-align:2px;margin-left:2px;color:var(--messing);}

.nx-karte{max-width:940px;margin:0 auto 20px;padding:0 24px;}
.nx-inner{background:var(--nacht-bg);border:1px solid #D3D9E6;border-radius:20px;padding:22px 24px;
 display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.nx-nr{width:44px;height:44px;border-radius:50%;background:var(--nacht);color:#fff;flex:none;
 display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;}
.nx-txt{flex:1;min-width:220px;}
.nx-lab{font-family:var(--sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--messing);}
.nx-titel{font-family:var(--serif);font-size:21px;line-height:1.2;margin:2px 0 3px;}
.nx-was{font-size:14.5px;color:var(--leise);line-height:1.55;}
.nx-b{font-family:var(--sans);font-size:15px;border:1px solid var(--nacht);background:var(--nacht);color:#fff;
 padding:12px 24px;border-radius:24px;text-decoration:none;white-space:nowrap;}
.nx-b:hover{background:#3B4970;}
.nx-fort{font-size:12.5px;color:var(--leise);margin-top:10px;padding:0 4px;}

.hw{max-width:940px;margin:0 auto 24px;padding:0 24px;}
.hw-kopf{font-family:var(--serif);font-size:clamp(23px,4vw,31px);font-weight:300;color:var(--tinte);
 margin:0 0 4px;letter-spacing:-.01em;}
.hw-unter{font-size:14.5px;color:var(--leise);margin-bottom:16px;line-height:1.55;}
.hw-buehne{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
@media(max-width:640px){.hw-buehne{grid-template-columns:1fr;}}
.hw-gross{display:flex;gap:16px;align-items:center;border:1px solid;border-radius:20px;padding:20px 22px;}
.hw-gl{font-size:46px;line-height:1;flex:none;}
.hw-lab{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--leise);}
.hw-name{font-family:var(--serif);font-size:24px;line-height:1.15;color:var(--tinte);margin:2px 0 4px;}
.hw-txt{font-size:14.3px;line-height:1.5;color:var(--tinte);}
.hw-mein{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--nacht);margin-top:7px;
 background:rgba(255,255,255,.6);border-radius:9px;padding:4px 9px;display:inline-block;}
.hw-titel{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--messing);margin:22px 0 9px;}
.hw-streifen{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
@media(max-width:640px){.hw-streifen{grid-template-columns:1fr;}}
.hw-kachel{background:var(--papier);border:1px solid;border-radius:16px;padding:15px 17px;}
.hw-kgl{font-size:26px;line-height:1;margin-bottom:6px;}
.hw-kname{font-family:var(--serif);font-size:17px;color:var(--tinte);margin-bottom:5px;}
.hw-r{font-family:var(--sans);font-size:11px;color:#A05A3A;}
.hw-ktxt{font-size:13.8px;line-height:1.55;color:var(--leise);margin-bottom:8px;}
.hw-kwech{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--messing);}
.hw-kmein{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--nacht);margin-top:3px;}
.hw-lang{display:flex;gap:7px;flex-wrap:wrap;}
.hw-lp{font-size:13px;background:var(--papier);border:1px solid var(--linie);border-radius:14px;
 padding:6px 12px;color:var(--leise);}
.hw-lp b{font-size:15px;}
.hw-lp i{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--nacht);}
.hw-rl{background:#FBF0E8;border-left:3px solid #A05A3A;border-radius:13px;padding:13px 16px;
 margin-top:16px;font-size:14px;line-height:1.6;}
.hw-lun{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
@media(max-width:640px){.hw-lun{grid-template-columns:1fr;}}
.hw-lk{background:var(--nacht-bg);border:1px solid #D3D9E6;border-radius:16px;padding:15px 17px;}
.hw-lk.voll{background:var(--messing-bg);border-color:var(--linie);}
.hw-ldat{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--messing);}
.hw-lname{font-family:var(--serif);font-size:19px;color:var(--nacht);margin:2px 0 3px;}
.hw-lzeichen{font-size:14px;color:var(--tinte);margin-bottom:8px;}
.hw-lmein{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--nacht);line-height:1.5;}
.hw-lmein span{color:var(--leise);}
.hw-fuss{font-size:13.5px;color:var(--leise);margin-top:16px;line-height:1.6;}

.st-wrap{max-width:660px;margin:0 auto;padding:34px 24px 60px;}
.st-datum{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--messing);margin-bottom:7px;}
.st-gruss{font-family:var(--serif);font-size:clamp(27px,5.6vw,38px);font-weight:300;
 color:var(--tinte);line-height:1.12;letter-spacing:-.015em;margin:0 0 30px;}
.st-gruss em{font-style:italic;color:var(--nacht);}

.kap{background:var(--papier);border:1px solid var(--linie);border-radius:22px;padding:24px 26px;margin-bottom:34px;}
.kap-f{font-family:var(--serif);font-size:21px;color:var(--nacht);margin-bottom:5px;}
.kap-h{font-size:14px;color:var(--leise);line-height:1.55;margin-bottom:16px;}
.kap-w{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.kap-w button{font-family:var(--sans);font-size:16px;padding:18px 10px;border:1px solid var(--linie);
 background:var(--bg);color:var(--tinte);border-radius:16px;cursor:pointer;line-height:1.25;}
.kap-w button:hover{border-color:var(--nacht);}
.kap-w button span{display:block;font-size:12px;color:var(--leise);margin-top:4px;}
.kap-w button:hover span{color:var(--tinte);}
.kap-w button[aria-pressed="true"]{background:var(--nacht);border-color:var(--nacht);color:#fff;}
.kap-w button[aria-pressed="true"] span{color:rgba(255,255,255,.72);}
.kap-zurueck{margin-top:14px;font-size:13.5px;color:var(--leise);}
.kap-zurueck button{font-family:var(--sans);font-size:13.5px;background:none;border:none;
 color:var(--nacht);text-decoration:underline;cursor:pointer;padding:0;}

/* Abschnitte — immer dieselbe Reihenfolge, einer pro Block */
.ab{margin-bottom:34px;}
.ab-lab{font-family:var(--sans);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
 color:var(--messing);margin-bottom:10px;}
.ab-satz{font-family:var(--serif);font-size:clamp(20px,4.1vw,26px);line-height:1.38;color:var(--tinte);margin:0;}
.ab-satz b{color:var(--nacht);font-weight:400;}
.ab-dazu{font-size:15px;line-height:1.65;color:var(--leise);margin:12px 0 0;}
.ab-karte{background:var(--papier);border:1px solid var(--linie);border-radius:20px;padding:22px 24px;}
.ab-karte.ruhig{background:var(--nacht-bg);border-color:#D3D9E6;}
.ab-karte h3{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--nacht);margin:0 0 8px;}
.ab-karte p{margin:0 0 9px;font-size:15px;line-height:1.65;}
.ab-karte p:last-child{margin-bottom:0;}
.ab-mehr{margin-top:14px;}
.ab-mehr button{font-family:var(--sans);font-size:14.5px;background:none;border:1px solid var(--linie);
 color:var(--nacht);border-radius:20px;padding:10px 20px;cursor:pointer;}
.ab-mehr button:hover{border-color:var(--nacht);background:var(--papier);}

.st-log{background:var(--messing-bg);border-radius:20px;padding:22px 24px;}
.st-log .frg{font-family:var(--serif);font-size:19px;color:var(--nacht);line-height:1.35;margin-bottom:13px;}
.st-wahl{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
@media(max-width:520px){.st-wahl{grid-template-columns:1fr 1fr;}}
.st-wahl button{font-family:var(--sans);font-size:14px;padding:13px 6px;border:1px solid var(--linie);
 background:var(--papier);color:var(--tinte);border-radius:13px;cursor:pointer;}
.st-wahl button[aria-pressed="true"]{background:var(--nacht);border-color:var(--nacht);color:#fff;}
.st-dank{font-size:14.5px;color:var(--leise);margin-top:11px;line-height:1.55;}

.st-schluss{text-align:center;padding:32px 0 12px;border-top:1px solid var(--linie);margin-top:12px;}
.st-schluss p{font-family:var(--serif);font-size:19px;color:var(--nacht);margin:0 0 6px;}
.st-schluss .kl{font-size:13.5px;color:var(--leise);line-height:1.6;}
.st-weiter{display:grid;gap:8px;margin-top:20px;}
.st-weiter a{display:flex;justify-content:space-between;align-items:center;gap:12px;
 background:var(--papier);border:1px solid var(--linie);border-radius:15px;padding:15px 18px;
 text-decoration:none;color:var(--tinte);}

function stärksterTransit(){
  var p=eigen(); if(!p) return null;
  var R=chartVon(p), T=jetztChart();
  var beste=null;
  var TEMPO={Jupiter:2,Saturn:3,Uranus:3,Neptun:3,Pluto:3,Mars:1,Sonne:.5,Merkur:.3,Venus:.5};
  var AGEW={Konjunktion:3,Opposition:2.6,Quadrat:2.6,Trigon:1.8,Sextil:.8};
  Object.keys(T).forEach(function(t){
    if(t==='Mond') return;
    Object.keys(R).forEach(function(r){
      if(!GEW[r]) return;
      var sep=Math.abs(nrm(T[t]-R[r]+180)-180);
      [[0,'Konjunktion'],[60,'Sextil'],[90,'Quadrat'],[120,'Trigon'],[180,'Opposition']].forEach(function(A){
        var o=Math.abs(sep-A[0]);
        var max=(A[0]===60)?2:3;
        if(o>max) return;
        var sc=(max-o)/max*3 + (GEW[r]||1) + (TEMPO[t]||0) + (AGEW[A[1]]||1);
        if(t===r&&A[1]==='Sextil') sc-=2;
        if(!beste||sc>beste.sc) beste={t:t,r:r,typ:A[1],o:o,sc:sc,
          haus:(((Math.floor(T[t]/30)-Math.floor(R.ASC/30))%12+12)%12)+1};
      });
    });
  });
  return beste;
}

}

    b.innerHTML=o[1]+'<span>'+o[2]+'</span>';
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ kapSchreiben(o[0]); kapZeigen(); inhaltZeigen(); });
    w.appendChild(b);
  });
}

function inhaltZeigen(){
  var box=document.getElementById('stinhalt');
  var stufe=kapLesen();
  if(!stufe){ box.innerHTML=''; return; }

  var p=eigen(), h='';

  /* 1 · Immer: der eine Satz */
  var b=stärksterTransit(), sz=satzBauen(b);
  h+='<div class="ab"><div class="ab-lab">Heute bei dir</div>';
  if(sz){
    h+='<p class="ab-satz">'+sz.kurz+'</p>';
    if(stufe!=='wenig') h+='<p class="ab-dazu">'+sz.dazu+'</p>';
  } else if(!p){
    h+='<p class="ab-satz">Noch kein Chart hinterlegt.</p>'+
      '<p class="ab-dazu">Damit hier dein eigener Tag steht, brauche ich einmal deine Geburtsdaten. '+
      '<a href="profile.html">Chart anlegen</a></p>';
  } else {
    h+='<p class="ab-satz">Heute berührt nichts dein Chart eng.</p>'+
      '<p class="ab-dazu">Ruhige Tage gehören dazu und sind keine Lücke.</p>';
  }
  h+='</div>';

  /* 2 · Ab Mittel: Himmelswetter */
  if(stufe==='mittel'||stufe==='viel'){
    h+='<div class="ab"><div class="ab-lab">Der Himmel allgemein</div>'+
      '<div id="stwetter"></div></div>';
  }

  /* 3 · Ab Mittel: eine Frage ans Log */
  if((stufe==='mittel'||stufe==='viel')&&sz){
    h+='<div class="ab"><div class="st-log">'+
      '<div class="frg">Merkst du heute etwas davon?</div>'+
      '<div class="st-wahl" id="stlog"></div>'+
      '<div class="st-dank" id="stdank"></div></div></div>';
  }

  /* 4 · Nur Viel: ein Schritt und die Räume */
  if(stufe==='viel'){
    h+='<div class="ab"><div class="ab-lab">Falls du magst</div>'+
      '<div class="ab-karte ruhig"><h3>Ein Schritt für heute</h3>'+
      '<p id="stvorschlag">—</p></div></div>';
    var thGew=[];
    try{ thGew=window.AC_SETUP?AC_SETUP.themen():[]; }catch(e){}
    h+='<div class="ab"><div class="ab-lab">'+(thGew.length?'Deine Themen':'Wo du anfangen könntest')+
      '</div><div class="st-weiter" id="stweiter"></div></div>';
  }

  /* 5 · Bei Wenig: sichtbarer Ausstieg nach oben */
  if(stufe==='wenig'){
    h+='<div class="ab-mehr"><button type="button" id="stmehr">Doch mehr zeigen</button></div>';
  }

  /* 6 · Immer: ruhiger Abschluss */
  h+='<div class="st-schluss"><p>Das war’s für heute.</p>'+
    '<div class="kl">'+(stufe==='wenig'
      ? 'Mehr braucht es nicht. Morgen ist wieder Gelegenheit.'
      : 'Alles andere liegt da, wenn du es suchst — es läuft dir nicht weg.')+
    '<div class="kl" style="margin-top:14px;"><button type="button" id="stsetup" style="font-family:var(--sans);'+
    'font-size:13px;background:none;border:none;color:var(--leise);text-decoration:underline;cursor:pointer;padding:0;">'+
    'Einstellungen ändern</button></div></div>';

  box.innerHTML=h;

  /* Nachträge */
  if(document.getElementById('stwetter')&&window.AC_wetter){
    try{ AC_wetter(document.getElementById('stwetter')); }catch(e){}
  }
  var mehr=document.getElementById('stmehr');
  if(mehr) mehr.addEventListener('click',function(){ kapSchreiben('mittel'); kapZeigen(); inhaltZeigen(); });

  var lg=document.getElementById('stlog');
  if(lg){
    [['ja','Ja'],['teils','Ein bisschen'],['nein','Nein'],['weiss','Weiß nicht']].forEach(function(o){
      var bt=document.createElement('button'); bt.type='button'; bt.textContent=o[1];
      bt.setAttribute('aria-pressed','false');
      bt.addEventListener('click',function(){
        Array.prototype.forEach.call(lg.children,function(c){c.setAttribute('aria-pressed','false');});
        bt.setAttribute('aria-pressed','true');
        document.getElementById('stdank').textContent='Notiert. Mehr ist nicht nötig.';
        try{
          if(window.AC_WEG&&b) AC_WEG.notieren({schluessel:'heute-'+b.t+'-'+b.r,
            titel:b.t+' '+b.typ+' '+b.r, planet:b.t, punkt:b.r, art:'transit', antwort:o[0], chips:[]});
        }catch(e){}
      });
      lg.appendChild(bt);
    });
  }

  var vs=document.getElementById('stvorschlag');
  if(vs) vs.innerHTML=vorschlag(b);

  var wt=document.getElementById('stweiter');
  if(wt) wt.innerHTML=raeumeVorschlag(b);

  var su=document.getElementById('stsetup');
  if(su) su.addEventListener('click',function(){ location.href='ankommen.html'; });
}

function vorschlag(b){
  if(!b) return 'Nimm dir heute nichts vor. Das ist auch eine Entscheidung.';
  var V={Saturn:'Schau dir eine Sache an, die du aufgeschoben hast. Nur anschauen, nicht erledigen.',
   Jupiter:'Sag heute einmal Ja zu etwas, das du sonst abwägen würdest.',
   Uranus:'Mach eine Kleinigkeit anders als sonst. Anderer Weg, andere Reihenfolge.',
   Neptun:'Lass heute eine Stunde ungeplant. Nichts hineinschreiben.',
   Pluto:'Benenne eine Sache, die du sonst umschiffst. Nur für dich, nur ein Satz.',
   Mars:'Fang etwas an, das fünf Minuten dauert.',
   Venus:'Gönn dir eine Kleinigkeit ohne Anlass.',
   Merkur:'Schreib einen Gedanken auf, statt ihn weiterzudenken.',
   Sonne:'Zeig heute einmal etwas Eigenes, ohne es kleinzureden.'};
  return (V[b.t]||'Beobachte heute nur, ohne etwas zu ändern.')+
    ' <span style="color:var(--leise);font-size:14px;">Muss nicht sein. Es steht hier, falls du magst.</span>';
}

function raeumeVorschlag(b){
  var ich=null; try{ ich={themen:(window.AC_SETUP?AC_SETUP.themen():[])}; }catch(e){}
  var ALLE={'selbstwert':['Selbstwert','Warum nehme ich zu wenig?'],'berufung':['Berufung','Wofür bin ich hier?'],
   'naehe':['Nähe','Warum wiederholt sich das?'],'unerlaubte':['Das Unerlaubte','Was traue ich mir nicht zu?'],
   'wunder-punkt':['Der wunde Punkt','Was tut immer wieder weh?'],'herkunft':['Herkunft','Was läuft aus der Familie mit?'],
   'anders-verdrahtet':['Anders verdrahtet','Warum ist Alltag so anstrengend?'],'zugehoerigkeit':['Zugehörigkeit','Warum fühle ich mich außen?'],
   'alltag':['Alltag','Struktur, die hält'],'koerper':['Körper','Was braucht mein Körper?']};
  if(ich&&ich.themen&&ich.themen.length){
    return ich.themen.slice(0,3).map(function(t){ var r=ALLE[t]; if(!r) return '';
      return '<a href="raum-'+t+'.html"><span><b>'+r[0]+'</b><br><span>'+r[1]+'</span></span><i>→</i></a>'; }).join('')+
      '<a href="raeume.html"><span><b>Alle zehn Räume</b><br><span>Übersicht</span></span><i>→</i></a>';
  }
  var ALLE={};
  try{ if(window.AC_SETUP) AC_SETUP.RAEUME.forEach(function(r){ ALLE[r[0]]=r; }); }catch(e){}
  var gewaehlt=[];
  try{ gewaehlt=window.AC_SETUP?AC_SETUP.themen():[]; }catch(e){}
  var w=[];
  if(gewaehlt.length){
    gewaehlt.slice(0,3).forEach(function(k){
      var r=ALLE[k]; if(r) w.push(['raum-'+r[0]+'.html', r[1], r[2]]);
    });
  } else {
    var R=[['raum-selbstwert.html','Selbstwert','Warum nehme ich zu wenig?'],
     ['raum-berufung.html','Berufung','Wofür bin ich hier?'],
     ['raum-naehe.html','Nähe','Warum wiederholt sich das?'],
     ['raum-anders-verdrahtet.html','Anders verdrahtet','Warum ist der Alltag so anstrengend?'],
     ['raum-alltag.html','Alltag','Struktur, die hält'],
     ['raum-herkunft.html','Herkunft','Was läuft aus der Familie mit?']];
    var ZU={Saturn:0,Venus:0,Jupiter:1,Sonne:1,Mars:4,Merkur:3,Uranus:3,Mond:2,Pluto:5,Neptun:5};
    var i=(b&&ZU[b.t]!==undefined)?ZU[b.t]:0;
    w=[R[i], R[(i+3)%R.length]];
  }
  return w.map(function(x){
    return '<a href="'+x[0]+'"><span><b>'+x[1]+'</b><br><span>'+x[2]+'</span></span><i>→</i></a>';
  }).join('')+'<a href="raeume.html"><span><b>Alle zehn Räume</b><br><span>Übersicht</span></span><i>→</i></a>';
}

function normalZeigen(){
  document.getElementById('stankommen').innerHTML='';
  document.getElementById('stnormal').style.display='';
  /* Leseformat aus dem Ankommen anwenden */
  try{
    if(window.AC_SETUP){
      var f=AC_SETUP.format()||'lang';
      document.body.classList.remove('fmt-kurz','fmt-lang','fmt-visuell');
      document.body.classList.add('fmt-'+f);
      localStorage.setItem('ac_format', f);
    }
  }catch(e){}
  datumZeigen();
  kapZeigen();
  inhaltZeigen();
}

function start(){
  var fertig=false, hatChart=false;
  try{ fertig=window.AC_SETUP?AC_SETUP.fertig():false; }catch(e){}
  try{ hatChart=!!(window.AC_P&&AC_P.eigenes()); }catch(e){}
  if(!fertig&&!hatChart){ location.replace('ankommen.html'); return; }
  normalZeigen();
  bannerZeigen(fertig);
}
function bannerZeigen(fertig){
  var box=document.getElementById('stankommen'); if(!box) return;
  if(fertig){ box.innerHTML=''; return; }
  box.innerHTML='<a class="st-banner" href="ankommen.html">'+
    '<span class="st-bi">✦</span>'+
    '<span><b>Einmal kurz ankommen?</b><br>'+
    '<span>Vier Fragen, damit sich die Seite nach dir richtet — wie du liest, wie viel Erklärung du brauchst, was dich beschäftigt.</span></span>'+
    '<i>→</i></a>';
}
start();

</script>
