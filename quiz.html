<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title><style>@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FBF7F2;--card:#FCE9DD;--ink:#2A1B12;--soft:#8A6F5C;
  --ind:#C1440E;--gold:#D9922E;--line:#F0D8C6;
  --fire:#C1440E;--earth:#6B7C3F;--air:#3E7C9A;--water:#6B5B95;
  --flow:#4A7C59;--tense:#B5502E;
}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;}
.wrap{max-width:860px;margin:0 auto;padding:34px 20px 80px;}
.back{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ind);text-decoration:none;margin-bottom:22px;}
.back:hover{text-decoration:underline;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(32px,6.5vw,52px);line-height:1.03;letter-spacing:-.02em;margin-bottom:14px;color:var(--ind);}
h1 em{font-style:italic;}
.lede{font-size:16px;color:var(--soft);max-width:640px;line-height:1.7;margin-bottom:8px;}
h2{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:38px 0 8px;color:var(--ind);}
h3{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin:24px 0 6px;}
.sub{font-size:14px;color:var(--soft);margin-bottom:16px;}
p{margin-bottom:12px;}
.tip{background:#FBEFE6;border-left:3px solid var(--gold);border-radius:10px;padding:16px 18px;margin:24px 0;font-size:14px;line-height:1.6;color:var(--soft);}
.tip b{color:var(--ink);}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
.foot{margin-top:44px;padding-top:22px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--soft);line-height:1.6;}
.pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px;}
.pill.fire{background:#FBE3DA;color:var(--fire);}
.pill.earth{background:#E8EDDC;color:var(--earth);}
.pill.air{background:#DEEBF1;color:var(--air);}
.pill.water{background:#E6E1F0;color:var(--water);}
a{color:var(--ind);}

.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;}
.qt{font-family:Fraunces,serif;font-size:19px;font-weight:600;margin-bottom:16px;line-height:1.3;}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14.5px;cursor:pointer;font-family:Inter,sans-serif;color:var(--ink);transition:all .15s;}
.opt:hover{border-color:var(--gold);}
.opt.correct{background:#DFF0E4;border-color:var(--flow);color:var(--flow);font-weight:600;}
.opt.wrong{background:#FADDD3;border-color:var(--tense);color:var(--tense);}
.expl{font-size:13.5px;color:var(--soft);line-height:1.55;margin-top:12px;padding:12px 14px;background:#FBEFE6;border-radius:10px;display:none;}
.expl.show{display:block;}
.result{background:var(--ink);color:var(--bg);border-radius:18px;padding:30px;text-align:center;display:none;}
.result.show{display:block;}
.result .score{font-size:48px;font-family:Fraunces,serif;color:#F2C4A0;margin:10px 0;}
.retry{background:var(--gold);color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer;font-size:14px;margin-top:8px;}
.progress{font-family:JetBrains Mono,monospace;font-size:12px;color:var(--gold);margin-bottom:10px;}

.weiter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:38px 0 0;}
@media(max-width:560px){.weiter{grid-template-columns:1fr;}}
.weiter a{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:14px 16px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;}
.weiter a:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(193,68,14,.10);}
.weiter .lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
.weiter .ttl{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;color:var(--ind);line-height:1.25;}
.weiter .nx{text-align:right;}
.weiter .end{grid-column:1/-1;text-align:center;}
</style></head><body>
<div class="wrap"><a class="back" href="index.html">&larr; Startseite</a>
<div class="eyebrow">Üben</div><h1>Teste dein <em>Wissen.</em></h1>
<p class="lede">Zwölf Fragen zu den Grundlagen. Nach jeder Antwort kommt die Erklärung — so verinnerlichst du es Schritt für Schritt.</p>
<div class="progress" id="progress"></div>
<div id="quizbox"></div>
<div class="result" id="result"><div class="eyebrow" style="color:#F2C4A0">Dein Ergebnis</div><div class="score" id="scorenum"></div><p id="resultmsg" style="color:#E8DDD3;margin-bottom:16px;"></p><button class="retry" onclick="retry()">Nochmal &#8635;</button></div>
<div class="weiter"><a href="angebote-struktur.html"><span class="lbl">&larr; Vorher</span><span class="ttl">Deine Angebote</span></a><a href="uebungscharts.html" class="nx"><span class="lbl">Weiter &rarr;</span><span class="ttl">Übungscharts</span></a></div>
<div class="foot">Quiz · Deine Astro-Lernplattform. Wiederholung ist der beste Weg zu verinnerlichen.</div>
</div><script>
const quiz=[
{q:"Was ist der PLANET in einem Chart?",opts:["Wie sich etwas ausdrückt","Das WAS — welche Kraft wirkt","Der Lebensbereich","Der Winkel zwischen zweien"],correct:1,expl:"Der Planet ist das WAS — die Grundkraft. Sonne=Identität, Mond=Gefühl, Mars=Antrieb."},
{q:"Das ZEICHEN eines Planeten zeigt…",opts:["Das WO (Lebensbereich)","Das WIE (die Art des Ausdrucks)","Die Stärke","Ob er rückläufig ist"],correct:1,expl:"Das Zeichen ist das WIE — es färbt den Planeten. Sonne in Widder = der Kern drückt sich mutig/direkt aus."},
{q:"Das HAUS zeigt…",opts:["Das WO — den Lebensbereich","Das Element","Den Aspekt","Das Alter"],correct:0,expl:"Das Haus ist das WO. Ein Planet im 7. Haus wirkt in Beziehungen, im 10. im Beruf."},
{q:"Welcher Aspekt bedeutet mühelosen FLUSS?",opts:["Quadrat (90°)","Opposition (180°)","Trigon (120°)","Konjunktion (0°)"],correct:2,expl:"Das Trigon (120°) ist der harmonischste Aspekt — die Planeten fließen mühelos zusammen."},
{q:"Ein QUADRAT (90°) bedeutet…",opts:["Verschmelzung","Reibung — aber auch Wachstum","Perfekte Harmonie","Gleichgültigkeit"],correct:1,expl:"Das Quadrat ist Spannung — Reibung, die Druck erzeugt, aber auch Antrieb und Wachstum."},
{q:"Was heißt 'Saturn transit-Konjunktion Sonne'?",opts:["Sie ist ein Saturn-Typ","Der heutige Saturn aktiviert die Geburts-Sonne","Saturn steht im 1. Haus","Die Sonne wird schwächer"],correct:1,expl:"Der heutige Saturn kommt an die Geburts-Sonne und aktiviert/drückt sie — vorübergehend, bis er weiterzieht."},
{q:"Welche drei liest man ZUERST?",opts:["Alle Aspekte","Sonne, Mond, Aszendent","Nur Pluto","Die Häuserspitzen"],correct:1,expl:"Immer mit den drei Großen anfangen: Sonne (Kern), Mond (Gefühl), Aszendent (Auftreten). Schon 50% des Bildes."},
{q:"Was ist ein 'Stellium'?",opts:["Ein einzelner Planet","3+ Planeten im selben Zeichen/Haus","Ein Aspekt","Der MC"],correct:1,expl:"Ein Stellium ist eine Häufung von 3+ Planeten — ein starker Schwerpunkt, ein Lebensthema."},
{q:"Der ASZENDENT zeigt…",opts:["Das Gefühlsleben","Auftreten & wie man in die Welt tritt","Die Berufung","Die Vergangenheit"],correct:1,expl:"Der Aszendent ist das Auftreten, der erste Eindruck, wie man in die Welt tritt. Beginn des 1. Hauses."},
{q:"Der NORDKNOTEN zeigt…",opts:["Die Komfortzone","Die Wachstumsrichtung / den Seelenweg","Alte Talente","Den Beruf"],correct:1,expl:"Der Nordknoten zeigt, wohin die Seele wächst — herausfordernd, aber erfüllend. Der Südknoten ist das Vertraute."},
{q:"Rote Linien im Chart sind meist…",opts:["Harmonische Aspekte","Spannungsaspekte (Quadrat/Opposition)","Bedeutungslos","Häuserspitzen"],correct:1,expl:"Rote Linien = Spannung (Quadrate, Oppositionen). Nicht 'schlecht' — die Muskeln, an denen man wächst. Blau/grün = harmonisch."},
{q:"Der wichtigste Coaching-Grundsatz?",opts:["Die Sterne bestimmen das Schicksal","Das Chart zeigt Anlagen, Menschen entscheiden","Immer alles vorhersagen","Nur Probleme benennen"],correct:1,expl:"'Das Chart zeigt Anlagen, Menschen entscheiden.' Der Satz, der aus Astrologie verantwortungsvolles Coaching macht."},
];
let cur=0,score=0;
function render(){
  const c=document.getElementById('quizbox');
  if(cur>=quiz.length){
    document.getElementById('result').classList.add('show');c.style.display='none';document.getElementById('progress').style.display='none';
    let msg=score>=10?"Wow! Du liest Charts schon richtig gut. ✦":score>=7?"Stark! Das Fundament sitzt. ☽":"Guter Anfang — geh die Module nochmal durch, dann sitzt es.";
    document.getElementById('scorenum').textContent=score+"/"+quiz.length;
    document.getElementById('resultmsg').textContent=msg;return;
  }
  const item=quiz[cur];
  document.getElementById('progress').textContent="Frage "+(cur+1)+" von "+quiz.length;
  c.innerHTML='<div class="qc"><div class="qt">'+item.q+'</div>'+item.opts.map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+o+'</button>').join('')+'<div class="expl" id="expl">'+item.expl+'</div></div>';
}
function answer(i){
  const item=quiz[cur];const btns=document.querySelectorAll('.opt');
  btns.forEach((b,idx)=>{b.disabled=true;if(idx===item.correct)b.classList.add('correct');if(idx===i&&i!==item.correct)b.classList.add('wrong');});
  if(i===item.correct)score++;
  document.getElementById('expl').classList.add('show');
  setTimeout(()=>{cur++;render();},2500);
}
function retry(){cur=0;score=0;document.getElementById('result').classList.remove('show');document.getElementById('quizbox').style.display='block';document.getElementById('progress').style.display='block';render();}
window.onload=render;
</script></body></html>
